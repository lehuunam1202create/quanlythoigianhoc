<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forest — Quản lý Công việc & Học tập Google Sheets</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg-grad: linear-gradient(160deg, #f3f6f4 0%, #e7efe9 48%, #d7e4dc 100%);
      --glass-bg: rgba(255, 255, 255, 0.78);
      --glass-strong: rgba(255, 255, 255, 0.92);
      --glass-border: rgba(255, 255, 255, 0.72);
      --glass-blur: 14px;
      --text-main: #111827;
      --text-muted: #64748b;
      --accent-dark: #111827;
      --accent-rose-bg: #f6d5d8;
      --accent-rose-border: #ecc0c5;
      --accent-crimson: #c0262d;
      --pill-maroon: #7f1d2d;
      --pill-blue: #4f86a8;
      --pill-black: #18181b;
      --pill-alert-bg: #fce7f3;
      --pill-alert-text: #be123c;
    }

    body.theme-sunset {
      --bg-grad: linear-gradient(160deg, #fdf6f3 0%, #f6e6df 50%, #ebd7ce 100%);
    }
    body.theme-pastel {
      --bg-grad: linear-gradient(160deg, #fdf2f4 0%, #f6e7ec 50%, #ebdce4 100%);
    }
    body.theme-aurora {
      --bg-grad: linear-gradient(160deg, #0f172a 0%, #132a2e 52%, #1e293b 100%);
      --glass-bg: rgba(20, 30, 42, 0.76);
      --glass-strong: rgba(26, 39, 54, 0.90);
      --glass-border: rgba(148, 163, 184, 0.22);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-dark: #10b981;
      --accent-rose-bg: #3b1f2b;
      --accent-rose-border: #5c2d3e;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-grad);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .forest-bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.05);
    }

    .glass-strong {
      background: var(--glass-strong);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 32px rgba(15, 23, 42, 0.06);
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-main);
      transition: transform 0.14s ease, background-color 0.14s ease, color 0.14s ease;
      text-align: left;
      cursor: pointer;
    }
    .nav-btn:hover {
      background: rgba(15, 23, 42, 0.06);
    }
    body.theme-aurora .nav-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .nav-btn.active {
      background: var(--accent-dark);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(17, 24, 39, 0.18);
    }

    /* Calendar grid */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border-top: 1px solid rgba(148, 163, 184, 0.22);
      border-left: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 14px;
      overflow: hidden;
    }
    .cal-cell {
      min-height: 98px;
      padding: 6px;
      border-right: 1px solid rgba(148, 163, 184, 0.22);
      border-bottom: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(255, 255, 255, 0.52);
      transition: background-color 0.14s ease;
      cursor: pointer;
    }
    body.theme-aurora .cal-cell {
      background: rgba(15, 23, 42, 0.35);
    }
    .cal-cell:hover {
      background: rgba(255, 255, 255, 0.85);
    }
    body.theme-aurora .cal-cell:hover {
      background: rgba(30, 41, 59, 0.65);
    }
    .cal-pill {
      display: block;
      width: 100%;
      padding: 2.5px 6px;
      margin-top: 3px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cal-pill-maroon { background: var(--pill-maroon); color: #fff; }
    .cal-pill-blue { background: var(--pill-blue); color: #fff; }
    .cal-pill-black { background: var(--pill-black); color: #fff; }
    .cal-pill-alert {
      background: var(--pill-alert-bg);
      color: var(--pill-alert-text);
      border: 1px solid rgba(190, 18, 60, 0.16);
    }

    /* Course Accordion matching Image 3 */
    .chapter-header {
      background: var(--accent-rose-bg);
      border: 1px solid var(--accent-rose-border);
      box-shadow: 0 3px 10px rgba(190, 24, 93, 0.06);
      transition: filter 0.14s ease;
    }
    .chapter-header:hover {
      filter: brightness(0.98);
    }
    .progress-track {
      width: 112px;
      height: 8px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }
    body.theme-aurora .progress-track {
      background: rgba(148, 163, 184, 0.25);
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent-crimson);
      transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Smooth custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.28); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.45); }

    .toast-enter {
      animation: toastSlide 0.22s ease forwards;
    }
    @keyframes toastSlide {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(DEFAULT_STATE),
          ...parsed,
          googleAuth: { ...structuredClone(DEFAULT_STATE.googleAuth), ...(parsed.googleAuth || {}) }
        };
      } catch (e) {
        return structuredClone(DEFAULT_STATE);
      }
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Ignore storage quota / sandbox restrictions
      }
    }

    function showToast(message, type = 'info') {
      const stack = document.getElementById('toastStack');
      if (!stack) return;
      const el = document.createElement('div');
      const colors = {
        success: 'bg-emerald-900 text-white border-emerald-700',
        error: 'bg-rose-900 text-white border-rose-700',
        info: 'bg-slate-900 text-white border-slate-700'
      };
      el.className = `toast-enter pointer-events-auto px-4 py-2.5 rounded-2xl border shadow-lg text-xs font-medium flex items-center gap-2 max-w-sm ${colors[type] || colors.info}`;
      el.textContent = nfc(message);
      stack.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 3200);
    }

    // =========================================================================
    // GOOGLE SIGN-IN (GIS OAuth 2.0) & UNIVERSAL GOOGLE SHEETS AUTO-SYNC ENGINE
    // =========================================================================
    let gisLoaded = false;

    function loadGisScript() {
      return new Promise((resolve, reject) => {
        if (window.google && window.google.accounts && window.google.accounts.oauth2) {
          gisLoaded = true;
          return resolve();
        }
        const existing = document.getElementById('gis-script');
        if (existing) {
          existing.addEventListener('load', () => { gisLoaded = true; resolve(); });
          existing.addEventListener('error', () => reject(new Error('Không thể tải Google Identity Services')));
          return;
        }
        const s = document.createElement('script');
        s.id = 'gis-script';
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true;
        s.defer = true;
        s.onload = () => { gisLoaded = true; resolve(); };
        s.onerror = () => reject(new Error('Không thể tải thư viện đăng nhập Google'));
        document.head.appendChild(s);
      });
    }

    async function triggerGoogleSignIn(clientIdInput) {
      const cid = (clientIdInput || state.googleAuth.clientId || '').trim();
      if (!cid) {
        showToast('Vui lòng nhập Google OAuth Client ID để mở cửa sổ đăng nhập Google.', 'error');
        return;
      }
      state.googleAuth.clientId = cid;
      saveState();

      try {
        await loadGisScript();
        const tokenClient = window.google.accounts.oauth2.initTokenClient({
          client_id: cid,
          scope: 'https://www.googleapis.com/auth/spreadsheets.readonly https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
          callback: async (resp) => {
            if (resp.error) {
              showToast('Đăng nhập Google bị hủy hoặc gặp lỗi: ' + resp.error, 'error');
              return;
            }
            state.googleAuth.accessToken = resp.access_token;
            state.googleAuth.tokenExpiresAt = Date.now() + (Number(resp.expires_in || 3600) * 1000);
            state.googleAuth.signedIn = true;
            try {
              const uRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { Authorization: 'Bearer ' + resp.access_token }
              });
              if (uRes.ok) {
                const u = await uRes.json();
                state.googleAuth.user = {
                  name: nfc(u.name || 'Người dùng Google'),
                  email: u.email || '',
                  picture: u.picture || ''
                };
              }
            } catch (e) {
              state.googleAuth.user = { name: 'Tài khoản Google', email: 'Đã kết nối quyền đọc Sheets', picture: '' };
            }
            saveState();
            updateGoogleBadges();
            closeModal();
            showToast('Đăng nhập Google thành công! Bạn đã có thể đồng bộ mọi Google Sheet.', 'success');
            renderCurrentView();
          }
        });
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } catch (err) {
        showToast('Không thể khởi tạo đăng nhập Google trong môi trường hiện tại. Bạn vẫn có thể đồng bộ Sheet chia sẻ công khai hoặc dán dữ liệu.', 'error');
      }
    }

    function signOutGoogle() {
      state.googleAuth.signedIn = false;
      state.googleAuth.accessToken = '';
      state.googleAuth.tokenExpiresAt = 0;
      state.googleAuth.user = null;
      saveState();
      updateGoogleBadges();
      showToast('Đã đăng xuất tài khoản Google.', 'info');
      renderCurrentView();
    }

    function extractSheetId(urlOrId) {
      const s = (urlOrId || '').trim();
      const m = s.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (m) return m[1];
      if (/^[a-zA-Z0-9-_]{20,}$/.test(s)) return s;
      return '';
    }

    function extractYouTubeId(url) {
      if (!url) return '';
      const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|live\/|shorts\/))([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : '';
    }

    function classifyLink(url, labelText) {
      const u = (url || '').toLowerCase();
      const l = (labelText || '').toLowerCase();
      if (u.includes('youtu.be') || u.includes('youtube.com') || l.includes('video') || l.includes('live')) return 'video';
      if (l.includes('đáp án') || l.includes('dap an') || l.includes('lời giải') || l.includes('key')) return 'answer';
      return 'doc';
    }

    // Universal parser converting rows (from Sheets API v4, GViz JSON, or pasted TSV/CSV) into Chapters -> Lessons -> Items
    // Preserves existing user completion state when re-syncing from master sheet!
    function parseRowsToChapters(rows, existingCourse) {
      const oldDoneMap = {};
      if (existingCourse && existingCourse.chapters) {
        existingCourse.chapters.forEach(ch => {
          ch.lessons.forEach(ls => {
            ls.items.forEach(it => {
              const key = (nfc(ls.title) + '||' + nfc(it.label) + '||' + (it.url || '')).toLowerCase();
              oldDoneMap[key] = !!it.done;
            });
          });
        });
      }

      const chapters = [];
      let currentChapter = null;

      const ensureChapter = (title) => {
        const cleanTitle = nfc(title || 'DANH SÁCH BÀI HỌC').trim();
        currentChapter = {
          id: uid('ch'),
          title: cleanTitle,
          expanded: chapters.length === 0,
          lessons: []
        };
        chapters.push(currentChapter);
      };

      rows.forEach((row, rIdx) => {
        // Each cell is { text: string, url: string }
        const nonEmpty = row.filter(c => (c.text && c.text.trim()) || (c.url && c.url.trim()));
        if (!nonEmpty.length) return;

        const combinedText = nonEmpty.map(c => c.text.trim()).filter(Boolean).join(' ').trim();
        const links = [];
        row.forEach((cell, cIdx) => {
          const text = nfc(cell.text || '').trim();
          let url = (cell.url || '').trim();
          if (!url && /^https?:\/\//i.test(text)) {
            url = text;
          }
          if (url && /^https?:\/\//i.test(url)) {
            const type = classifyLink(url, text);
            const niceLabel = /^https?:\/\//i.test(text)
              ? (type === 'video' ? 'Video bài giảng YouTube' : type === 'answer' ? 'ĐÁP ÁN' : 'TÀI LIỆU')
              : text;
            links.push({ type, label: niceLabel, url });
          }
        });

        // Detect chapter header: starts with CHƯƠNG / PHẦN / CHUYÊN ĐỀ / UNIT / MODULE or single wide text without links
        const isChapterKeyword = /^(chương|chuong|phần|phan|chuyên đề|chuyen de|unit|module|tuần|tuan|giai đoạn|hướng dẫn)\b/i.test(combinedText);
        if (links.length === 0 && (isChapterKeyword || (nonEmpty.length === 1 && combinedText.length > 5 && combinedText === combinedText.toUpperCase()))) {
          // Skip sheet main title on row 0 if it says KHÓA ...
          if (rIdx === 0 && /^khóa\s/i.test(combinedText)) return;
          ensureChapter(combinedText);
          return;
        }

        // Skip table header rows like STT | TÊN BÀI | LINK
        if (links.length === 0 && /^(stt|buổi|tên bài|nội dung|chưa live)/i.test(combinedText)) return;

        // Find lesson title: longest non-URL, non-pure-number cell
        const titleCandidates = row
          .map(c => nfc(c.text || '').trim())
          .filter(t => t && !/^https?:\/\//i.test(t) && !/^\d+$/.test(t) && !/^(tài liệu|đáp án|link|xem|file)$/i.test(t));

        const lessonTitle = titleCandidates.sort((a, b) => b.length - a.length)[0] || combinedText;
        if (!lessonTitle || lessonTitle.length < 2) return;

        if (!currentChapter) ensureChapter('NỘI DUNG KHÓA HỌC');

        const items = links.length > 0
          ? links.map(lk => {
              const key = (lessonTitle + '||' + lk.label + '||' + lk.url).toLowerCase();
              return {
                id: uid('it'),
                type: lk.type,
                label: lk.label,
                url: lk.url,
                done: !!oldDoneMap[key]
              };
            })
          : [{
              id: uid('it'),
              type: 'doc',
              label: 'Hoàn thành nội dung buổi học',
              url: '',
              done: !!oldDoneMap[(lessonTitle + '||hoàn thành nội dung buổi học||').toLowerCase()]
            }];

        currentChapter.lessons.push({
          id: uid('ls'),
          title: lessonTitle,
          expanded: false,
          items
        });
      });

      if (chapters.length > 0) chapters[chapters.length - 1].expanded = true;
      return chapters;
    }

    // Fetch live data from Google Sheet (OAuth API v4 first if signed in -> fallback GViz public JSON)
    async function syncCourseFromGoogleSheet(course) {
      const sheetId = extractSheetId(course.sheetUrl || course.sheetId);
      if (!sheetId) {
        showToast('Khóa học này chưa gắn link Google Sheet. Hãy bấm "Thêm Sheet" để kết nối.', 'info');
        return false;
      }

      const nowStr = new Date().toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' });
      const hasValidToken = state.googleAuth.signedIn && state.googleAuth.accessToken && Date.now() < state.googleAuth.tokenExpiresAt;

      // Method 1: Official Google Sheets API v4 with OAuth token (reads private 'Chỉ xem' sheets + cell hyperlinks!)
      if (hasValidToken) {
        try {
          const tabParam = course.sheetTab ? `&ranges=${encodeURIComponent(course.sheetTab)}` : '';
          const apiUrl = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?includeGridData=true${tabParam}`;
          const res = await fetch(apiUrl, {
            headers: { Authorization: 'Bearer ' + state.googleAuth.accessToken }
          });
          if (res.ok) {
            const data = await res.json();
            const sheetObj = (data.sheets && data.sheets[0]) || null;
            if (sheetObj && sheetObj.data && sheetObj.data[0] && sheetObj.data[0].rowData) {
              const rows = sheetObj.data[0].rowData.map(r =>
                (r.values || []).map(v => ({
                  text: v.formattedValue || '',
                  url: v.hyperlink || (v.textFormatRuns && v.textFormatRuns.find(tr => tr.format && tr.format.link)?.format.link.uri) || ''
                }))
              );
              const parsedChapters = parseRowsToChapters(rows, course);
              if (parsedChapters.length > 0) {
                course.title = course.title || nfc(data.properties?.title || 'Khóa học Google Sheets');
                course.sheetTab = sheetObj.properties?.title || course.sheetTab || 'Sheet1';
                course.chapters = parsedChapters;
                course.lastSynced = nowStr;
                course.accessMode = 'Đã đồng bộ Google OAuth • Bản gốc';
                saveState();
                showToast(`Đã đồng bộ "${course.title}" từ Google Sheet gốc (${parsedChapters.length} chương)!`, 'success');
                return true;
              }
            }
          }
        } catch (e) {
          // Fall through to public GViz
        }
      }

      // Method 2: Public Google Visualization API (works for sheets shared "Bất kỳ ai có đường liên kết")
      try {
        const sheetQuery = course.sheetTab ? `&sheet=${encodeURIComponent(course.sheetTab)}` : '';
        const gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json${sheetQuery}`;
        const res = await fetch(gvizUrl);
        if (res.ok) {
          const rawText = await res.text();
          const jsonMatch = rawText.match(/google\.visualization\.Query\.setResponse\(([\s\S]+)\);?/);
          if (jsonMatch) {
            const payload = JSON.parse(jsonMatch[1]);
            const rows = (payload.table?.rows || []).map(r =>
              (r.c || []).map(cell => ({
                text: cell && (cell.f || cell.v) != null ? String(cell.f || cell.v) : '',
                url: ''
              }))
            );
            const parsedChapters = parseRowsToChapters(rows, course);
            if (parsedChapters.length > 0) {
              course.chapters = parsedChapters;
              course.lastSynced = nowStr;
              course.accessMode = 'Đồng bộ công khai • Bản gốc';
              saveState();
              showToast(`Đã đồng bộ "${course.title}" thành công từ bản gốc!`, 'success');
              return true;
            }
          }
        }
      } catch (e) {
        // Fallback notice below
      }

      showToast('Không thể đọc trực tiếp Sheet riêng tư khi chưa đăng nhập Google OAuth (hoặc Sheet bị hạn chế truy cập). Hãy đăng nhập Google hoặc dán bảng trực tiếp.', 'error');
      return false;
    }

    // =========================================================================
    // PROGRESS CALCULATIONS
    // =========================================================================
    function getLessonStats(lesson) {
      const videos = lesson.items.filter(i => i.type === 'video').length;
      const docs = lesson.items.filter(i => i.type !== 'video').length;
      const total = lesson.items.length;
      const done = lesson.items.filter(i => i.done).length;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      return { videos, docs, total, done, pct };
    }

    function getCourseStats(course) {
      let totalItems = 0, doneItems = 0, totalLessons = 0, completedLessons = 0;
      (course.chapters || []).forEach(ch => {
        (ch.lessons || []).forEach(ls => {
          totalLessons++;
          const st = getLessonStats(ls);
          totalItems += st.total;
          doneItems += st.done;
          if (st.total > 0 && st.done === st.total) completedLessons++;
        });
      });
      const pct = totalItems > 0 ? Math.round((doneItems / totalItems) * 100) : 0;
      return { totalItems, doneItems, totalLessons, completedLessons, pct };
    }

    // -------------------------------------------------------------------------
    // 2. CÔNG VIỆC VIEW (EXACT IMAGE 1 LAYOUT: PINE CARD + MONTHLY CALENDAR)
    // -------------------------------------------------------------------------
    function renderWorkView() {
      const monthNames = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];
      const filteredLeft = state.workItems.filter(w => state.workLeftTab === 'kho' ? w.category === 'kho' : w.category === 'booking');
      const groups = [
        { key: 'pending', label: 'Chờ làm', dot: 'bg-slate-900' },
        { key: 'doing', label: 'Đang thực hiện', dot: 'bg-[#881337]' },
        { key: 'done', label: 'Đã xong', dot: 'bg-[#4f86a8]' }
      ];

      // Build 35/42 calendar days (Mon -> Sun)
      const firstDay = new Date(state.calYear, state.calMonth, 1);
      const startOffset = (firstDay.getDay() + 6) % 7; // Mon=0 ... Sun=6
      const daysInMonth = new Date(state.calYear, state.calMonth + 1, 0).getDate();
      const prevMonthDays = new Date(state.calYear, state.calMonth, 0).getDate();
      const totalCells = startOffset + daysInMonth > 35 ? 42 : 35;

      const cells = [];
      for (let i = 0; i < totalCells; i++) {
        let dayNum, m = state.calMonth, y = state.calYear, isCurrent = true;
        if (i < startOffset) {
          dayNum = prevMonthDays - startOffset + i + 1;
          m = state.calMonth - 1;
          if (m < 0) { m = 11; y--; }
          isCurrent = false;
        } else if (i >= startOffset + daysInMonth) {
          dayNum = i - (startOffset + daysInMonth) + 1;
          m = state.calMonth + 1;
          if (m > 11) { m = 0; y++; }
          isCurrent = false;
        } else {
          dayNum = i - startOffset + 1;
        }
        const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
        const dayEvents = state.calendarEvents.filter(ev => {
          if (ev.date !== iso) return false;
          if (state.calFilter === 'all') return true;
          return ev.type === state.calFilter;
        });
        cells.push({ dayNum, iso, isCurrent, dayEvents });
      }

      const todayIso = '2026-11-21';

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Công việc</h1>
            <button type="button" id="addWorkTaskBtn" class="px-3.5 py-2 rounded-full bg-slate-900 text-white text-xs font-semibold hover:bg-slate-800 transition flex items-center gap-1.5 shadow-sm">

    // Relax: Pomodoro + Synthesized Forest Rain Audio
    let pomoSeconds = 25 * 60;
    let pomoRunning = false;

    let rainNode = null;
    let rainPlaying = false;

    function formatPomo(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

              <button type="button" id="rainToggleBtn" class="px-4 py-2.5 rounded-full border text-xs font-bold flex items-center gap-1.5 ${rainPlaying ? 'bg-emerald-700 text-white border-emerald-700' : 'bg-white border-slate-200 text-slate-700'}">

    function openAddSheetCourseModal() {
      openModal(`

            <input id="newCourseTitle" type="text" required placeholder="Vd: Thầy Lương Văn Huy - XPS2009 / Hóa 12 Thầy..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs" />

            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Tên Tab (Sheet)</label>
              <input id="newCourseTab" type="text" placeholder="TỔNG HỢP" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs" />
            </div>
          </div>

          <div class="pt-2 border-t border-slate-200">
            <label class="block text-xs font-bold text-slate-700 mb-1">Hoặc dán nhanh nội dung copy từ Google Sheet (tùy chọn)</label>
            <textarea id="newCoursePaste" rows="4" placeholder="Copy các dòng từ Google Sheet (gồm tên Chương, tên Buổi, link YouTube, link Tài liệu) rồi dán vào đây — hệ thống sẽ tự động chia chương và tạo thanh tiến độ %!" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-mono"></textarea>
          </div>

          <div class="flex items-center justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">Hủy</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold hover:bg-emerald-800">Lưu & Tự động đồng bộ</button>
          </div>
        </form>
      `);

      document.getElementById('addSheetCourseForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = nfc(document.getElementById('newCourseTitle').value.trim());
        const url = document.getElementById('newCourseUrl').value.trim();
        const tab = nfc(document.getElementById('newCourseTab').value.trim()) || 'TỔNG HỢP';
        const pasted = document.getElementById('newCoursePaste').value.trim();

        let chapters = [];
        if (pasted) {
          const rows = pasted.split(/\r?\n/).map(line =>
            line.split('\t').map(cell => ({ text: nfc(cell.trim()), url: '' }))
          );
          chapters = parseRowsToChapters(rows, null);
        }

        const newCourse = {
          id: uid('course'),
          title,
          teacher: title,
          sheetUrl: url,
          sheetId: extractSheetId(url),
          sheetTab: tab,
          accessMode: url ? 'Đang kết nối bản gốc' : 'Nhập trực tiếp',
          lastSynced: new Date().toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' }),
          chapters: chapters.length ? chapters : [{
            id: uid('ch'),
            title: 'CHƯƠNG 1 - DANH SÁCH BÀI HỌC',
            expanded: true,
            lessons: [{
              id: uid('ls'),
              title: 'Bấm "Đồng bộ từ bản gốc" sau khi đăng nhập Google để tải bài giảng',
              expanded: false,
              items: [{ id: uid('it'), type: 'doc', label: 'Mở Google Sheet gốc', url: url || 'https://docs.google.com/spreadsheets', done: false }]
            }]
          }]
        };

        state.courses.push(newCourse);
        state.selectedCourseId = newCourse.id;
        saveState();
        closeModal();
        renderCurrentView();

        if (url && !pasted) {
          const ok = await syncCourseFromGoogleSheet(newCourse);
          if (ok) renderCurrentView();
        } else {
          showToast(`Đã tạo khóa học "${title}" với thanh tiến độ tự động!`, 'success');
        }
      });
    }

            </select>
          </div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold">Thêm công việc</button>
        </form>
      `);
      document.getElementById('addWorkForm').addEventListener('submit', (e) => {
        e.preventDefault();
        state.workItems.unshift({
          id: uid('w'),
          title: nfc(document.getElementById('wkTitle').value.trim()),
          subtitle: nfc(document.getElementById('wkSub').value.trim()) || 'Cá nhân',
          status: document.getElementById('wkStatus').value,
          category: document.getElementById('wkCat').value
        });
        saveState();
        closeModal();
        renderCurrentView();
        showToast('Đã thêm công việc mới!', 'success');
      });
    }

    function toggleCourseItemDone(chId, lsId, itId, forceVal = null) {
      const course = state.courses.find(c => c.id === state.selectedCourseId);
      if (!course) return;
      const ch = course.chapters.find(c => c.id === chId);
      const ls = ch && ch.lessons.find(l => l.id === lsId);
      const it = ls && ls.items.find(i => i.id === itId);
      if (!it) return;
      it.done = forceVal !== null ? forceVal : !it.done;
      saveState();
      renderCurrentView();
    }

    // =========================================================================
    // EVENT BINDING AFTER RENDER
    // =========================================================================
    function bindViewEvents() {
      // Jump links
      document.querySelectorAll('[data-jump-view]').forEach(btn => {
        btn.addEventListener('click', () => setActiveNav(btn.dataset.jumpView));
      });

      // Study sub-tabs
      document.querySelectorAll('[data-study-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.studySubTab = btn.dataset.studyTab;
          saveState();
          renderCurrentView();
        });
      });

      // Google auth button
      const gBtn = document.getElementById('openGoogleAuthBtn');
      if (gBtn) gBtn.addEventListener('click', openGoogleAuthModal);

      // TKB day selector
      document.querySelectorAll('[data-select-day]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedDay = Number(btn.dataset.selectDay);
          saveState();
          renderCurrentView();
        });
      });

      const addTkbBtn = document.getElementById('addTkbSlotBtn');
      if (addTkbBtn) addTkbBtn.addEventListener('click', () => openTkbSlotModal(null));

      document.querySelectorAll('[data-toggle-tkb]').forEach(btn => {
        btn.addEventListener('click', () => {
          const list = state.timetable[state.selectedDay] || [];
          const slot = list.find(s => s.id === btn.dataset.toggleTkb);
          if (slot) {
            slot.done = !slot.done;
            saveState();
            renderCurrentView();
          }
        });
      });

      document.querySelectorAll('[data-edit-tkb]').forEach(btn => {
        btn.addEventListener('click', () => {
          const list = state.timetable[state.selectedDay] || [];
          const slot = list.find(s => s.id === btn.dataset.editTkb);
          if (slot) openTkbSlotModal(slot);
        });
      });

      document.querySelectorAll('[data-del-tkb]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.timetable[state.selectedDay] = (state.timetable[state.selectedDay] || []).filter(s => s.id !== btn.dataset.delTkb);
          saveState();
          renderCurrentView();
          showToast('Đã xóa khung giờ khỏi TKB.', 'info');
        });
      });

      // Course switcher & sync
      document.querySelectorAll('[data-select-course]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedCourseId = btn.dataset.selectCourse;
          saveState();
          renderCurrentView();
        });
      });

      const addCourseBtn = document.getElementById('addSheetCourseBtn');
      if (addCourseBtn) addCourseBtn.addEventListener('click', openAddSheetCourseModal);

      const syncBtn = document.getElementById('syncCurrentCourseBtn');
      if (syncBtn) {
        syncBtn.addEventListener('click', async () => {
          const course = state.courses.find(c => c.id === state.selectedCourseId);
          if (course) {
            const ok = await syncCourseFromGoogleSheet(course);
            if (ok) renderCurrentView();
          }
        });
      }

      const delCourseBtn = document.getElementById('deleteCourseBtn');
      if (delCourseBtn) {
        delCourseBtn.addEventListener('click', () => {
          state.courses = state.courses.filter(c => c.id !== state.selectedCourseId);
          state.selectedCourseId = state.courses[0]?.id || '';
          saveState();
          renderCurrentView();
          showToast('Đã xóa khóa học.', 'info');
        });
      }

      // Chapter & Lesson accordions
      document.querySelectorAll('[data-toggle-chapter]').forEach(btn => {
        btn.addEventListener('click', () => {
          const course = state.courses.find(c => c.id === state.selectedCourseId);
          const ch = course && course.chapters.find(c => c.id === btn.dataset.toggleChapter);
          if (ch) {
            ch.expanded = !ch.expanded;
            saveState();
            renderCurrentView();
          }
        });
      });

      document.querySelectorAll('[data-toggle-lesson]').forEach(el => {
        el.addEventListener('click', () => {
          const [chId, lsId] = el.dataset.toggleLesson.split('|');
          const course = state.courses.find(c => c.id === state.selectedCourseId);
          const ch = course && course.chapters.find(c => c.id === chId);
          const ls = ch && ch.lessons.find(l => l.id === lsId);
          if (ls) {
            ls.expanded = !ls.expanded;
            saveState();
            renderCurrentView();
          }
        });
      });

      document.querySelectorAll('[data-check-item]').forEach(cb => {
        cb.addEventListener('change', () => {
          const [chId, lsId, itId] = cb.dataset.checkItem.split('|');
          toggleCourseItemDone(chId, lsId, itId, cb.checked);
        });
      });

      document.querySelectorAll('[data-auto-study]').forEach(link => {
        link.addEventListener('click', () => {
          const [chId, lsId, itId] = link.dataset.autoStudy.split('|');
          toggleCourseItemDone(chId, lsId, itId, true);
          showToast('Đã tự động cập nhật tiến độ bài học!', 'success');
        });
      });

      document.querySelectorAll('[data-play-yt]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [ytId, chId, lsId, itId] = btn.dataset.playYt.split('|');
          openYouTubeModal(ytId, chId, lsId, itId);
        });
      });

      // Work view bindings
      document.querySelectorAll('[data-work-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.workLeftTab = btn.dataset.workTab;
          saveState();
          renderCurrentView();
        });
      });
      const addWorkBtn = document.getElementById('addWorkTaskBtn');
      if (addWorkBtn) addWorkBtn.addEventListener('click', openAddWorkTaskModal);

      document.querySelectorAll('[data-cycle-work]').forEach(btn => {
        btn.addEventListener('click', () => {
          const w = state.workItems.find(x => x.id === btn.dataset.cycleWork);
          if (w) {
            w.status = w.status === 'pending' ? 'doing' : w.status === 'doing' ? 'done' : 'pending';
            saveState();
            renderCurrentView();
          }
        });
      });
      document.querySelectorAll('[data-del-work]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.workItems = state.workItems.filter(x => x.id !== btn.dataset.delWork);
          saveState();
          renderCurrentView();
        });
      });

      document.querySelectorAll('[data-cal-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.calFilter = btn.dataset.calFilter;
          saveState();
          renderCurrentView();
        });
      });
      const calPrev = document.getElementById('calPrevBtn');
      if (calPrev) calPrev.addEventListener('click', () => {
        state.calMonth--;
        if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
        saveState();
        renderCurrentView();
      });
      const calNext = document.getElementById('calNextBtn');
      if (calNext) calNext.addEventListener('click', () => {
        state.calMonth++;
        if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
        saveState();
        renderCurrentView();
      });
      const calToday = document.getElementById('calTodayBtn');
      if (calToday) calToday.addEventListener('click', () => {
        state.calYear = 2026;
        state.calMonth = 10;
        saveState();
        renderCurrentView();
      });
      document.querySelectorAll('[data-open-cal-day]').forEach(cell => {
        cell.addEventListener('click', () => openCalendarDayModal(cell.dataset.openCalDay));
      });

      // Reminder bindings
      const remForm = document.getElementById('addReminderForm');
      if (remForm) {
        remForm.addEventListener('submit', (e) => {
          e.preventDefault();
          state.reminders.unshift({
            id: uid('r'),
            title: nfc(document.getElementById('remTitleInput').value.trim()),
            time: nfc(document.getElementById('remTimeInput').value.trim()) || 'Hôm nay',
            done: false
          });
          saveState();
          renderCurrentView();
        });
      }
      document.querySelectorAll('[data-toggle-rem]').forEach(cb => {
        cb.addEventListener('change', () => {
          const r = state.reminders.find(x => x.id === cb.dataset.toggleRem);
          if (r) { r.done = cb.checked; saveState(); renderCurrentView(); }
        });
      });
      document.querySelectorAll('[data-del-rem]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.reminders = state.reminders.filter(x => x.id !== btn.dataset.delRem);
          saveState();
          renderCurrentView();
        });
      });

      // Finance bindings
      const finForm = document.getElementById('addFinanceForm');
      if (finForm) {
        finForm.addEventListener('submit', (e) => {
          e.preventDefault();
          state.finance.unshift({
            id: uid('f'),
            title: nfc(document.getElementById('finTitle').value.trim()),
            amount: Number(document.getElementById('finAmount').value) || 0,
            type: document.getElementById('finType').value,
            date: new Date().toLocaleDateString('vi-VN')
          });
          saveState();
          renderCurrentView();
        });
      }
      document.querySelectorAll('[data-del-fin]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.finance = state.finance.filter(x => x.id !== btn.dataset.delFin);
          saveState();
          renderCurrentView();
        });
      });

      // Quick note bindings
      const noteForm = document.getElementById('addNoteForm');
      if (noteForm) {
        noteForm.addEventListener('submit', (e) => {
          e.preventDefault();
          state.notes.unshift({
            id: uid('n'),
            text: nfc(document.getElementById('quickNoteMainInput').value.trim()),
            createdAt: new Date().toLocaleDateString('vi-VN')
          });
          saveState();
          renderCurrentView();
        });
      }
      document.querySelectorAll('[data-del-note]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.notes = state.notes.filter(x => x.id !== btn.dataset.delNote);
          saveState();
          renderCurrentView();
        });
      });

      // Project bindings
      const addProjBtn = document.getElementById('addProjectBtn');
      if (addProjBtn) {
        addProjBtn.addEventListener('click', () => {
          openModal(`
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-base font-extrabold">Thêm liên kết dự án</h3>
              <button type="button" onclick="closeModal()" class="p-1.5 rounded-xl hover:bg-slate-100"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form id="projForm" class="space-y-3">
              <input id="pName" required placeholder="Tên ứng dụng / dự án..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs" />
              <input id="pDesc" placeholder="Mô tả ngắn..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs" />
              <input id="pUrl" type="url" required placeholder="https://..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs" />
              <button type="submit" class="w-full py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold">Lưu</button>
            </form>
          `);
          document.getElementById('projForm').addEventListener('submit', (e) => {
            e.preventDefault();
            state.projects.push({
              id: uid('p'),
              name: nfc(document.getElementById('pName').value.trim()),
              desc: nfc(document.getElementById('pDesc').value.trim()) || 'Liên kết nhanh',
              url: document.getElementById('pUrl').value.trim(),
              icon: 'link'
            });
            saveState();
            closeModal();
            renderCurrentView();
          });
        });
      }
      document.querySelectorAll('[data-del-proj]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.projects = state.projects.filter(x => x.id !== btn.dataset.delProj);
          saveState();
          renderCurrentView();
        });
      });

      // Relax Pomodoro & Forest Rain bindings
      document.querySelectorAll('[data-pomo-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
          clearInterval(pomoTimer);
          pomoRunning = false;
          pomoSeconds = Number(btn.dataset.pomoPreset) * 60;
          renderCurrentView();
        });
      });
      const pomoToggle = document.getElementById('pomoToggleBtn');
      if (pomoToggle) {
        pomoToggle.addEventListener('click', () => {
          if (pomoRunning) {
            clearInterval(pomoTimer);
            pomoRunning = false;
            renderCurrentView();
          } else {
            pomoRunning = true;
            clearInterval(pomoTimer);
            pomoTimer = setInterval(() => {
              if (pomoSeconds > 0) {
                pomoSeconds--;
                const disp = document.getElementById('pomoDisplay');
                if (disp) disp.textContent = formatPomo(pomoSeconds);
              } else {
                clearInterval(pomoTimer);
                pomoRunning = false;
                showToast('Hoàn thành phiên tập trung!', 'success');
                renderCurrentView();
              }
            }, 1000);
            renderCurrentView();
          }
        });
      }
      const pomoReset = document.getElementById('pomoResetBtn');
      if (pomoReset) {
        pomoReset.addEventListener('click', () => {
          clearInterval(pomoTimer);
          pomoRunning = false;
          pomoSeconds = 25 * 60;
          renderCurrentView();
        });
      }
      const rainBtn = document.getElementById('rainToggleBtn');
      if (rainBtn) {
        rainBtn.addEventListener('click', () => {
          if (rainPlaying) {
            if (rainNode) { try { rainNode.stop(); } catch (e) {} rainNode = null; }
            rainPlaying = false;
            renderCurrentView();
          } else {
            try {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              rainAudioCtx = rainAudioCtx || new AudioCtx();
              const bufSize = rainAudioCtx.sampleRate * 2;
              const buffer = rainAudioCtx.createBuffer(1, bufSize, rainAudioCtx.sampleRate);
              const out = buffer.getChannelData(0);
              let last = 0;
              for (let i = 0; i < bufSize; i++) {
                const white = Math.random() * 2 - 1;
                out[i] = (last + 0.02 * white) / 1.02;
                last = out[i];
                out[i] *= 0.25;
              }
              const src = rainAudioCtx.createBufferSource();
              src.buffer = buffer;
              src.loop = true;
              const gain = rainAudioCtx.createGain();
              gain.gain.value = 0.25;
              src.connect(gain);
              gain.connect(rainAudioCtx.destination);
              src.start();
              rainNode = src;
              rainPlaying = true;
              renderCurrentView();
            } catch (e) {
              showToast('Trình duyệt không hỗ trợ tạo âm thanh.', 'error');
            }
          }
        });
      }

      // Theme bindings
      document.querySelectorAll('[data-pick-theme]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.theme = btn.dataset.pickTheme;
          applyTheme();
          saveState();
          renderCurrentView();
        });
      });
      const blurSlider = document.getElementById('blurSlider');
      if (blurSlider) {
        blurSlider.addEventListener('input', () => {
          state.glassBlur = Number(blurSlider.value);
          document.getElementById('blurValLabel').textContent = state.glassBlur + 'px';
          applyTheme();
          saveState();
        });
      }

      // Settings bindings
      const setGBtn = document.getElementById('settingsGoogleBtn');
      if (setGBtn) setGBtn.addEventListener('click', openGoogleAuthModal);

      const autoSyncCb = document.getElementById('autoSyncToggle');
      if (autoSyncCb) {
        autoSyncCb.addEventListener('change', () => {
          state.autoSyncOnLoad = autoSyncCb.checked;
          saveState();
          showToast(state.autoSyncOnLoad ? 'Đã bật tự động đồng bộ bản gốc.' : 'Đã tắt tự động đồng bộ.', 'info');
        });
      }

      const expBtn = document.getElementById('exportBackupBtn');
      if (expBtn) {
        expBtn.addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'forest-study-backup.json';
          a.click();
          showToast('Đã tải xuống file sao lưu JSON.', 'success');
        });
      }

      const rstBtn = document.getElementById('resetDemoBtn');
      if (rstBtn) {
        rstBtn.addEventListener('click', () => {
          state = structuredClone(DEFAULT_STATE);
          saveState();
          applyTheme();
          updateGoogleBadges();
          renderCurrentView();
          showToast('Đã khôi phục dữ liệu mặc định.', 'info');
        });
      }
    }

    // =========================================================================
    // SIDEBAR & GLOBAL INIT
    // =========================================================================
    function openMobileSidebar() {
      document.getElementById('sidebar').classList.remove('-translate-x-full');
      document.getElementById('sidebarBackdrop').classList.remove('hidden');
    }
    function closeMobileSidebar() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('sidebarBackdrop').classList.add('hidden');
    }

    document.getElementById('mobileMenuBtn').addEventListener('click', openMobileSidebar);
    document.getElementById('closeSidebarBtn').addEventListener('click', closeMobileSidebar);
    document.getElementById('sidebarBackdrop').addEventListener('click', closeMobileSidebar);

    document.getElementById('sidebarGoogleCard').addEventListener('click', openGoogleAuthModal);
    document.getElementById('mobileGoogleBtn').addEventListener('click', openGoogleAuthModal);

    document.querySelectorAll('aside .nav-btn').forEach(btn => {
      btn.addEventListener('click', () => setActiveNav(btn.dataset.view));
    });

    function saveSidebarQuickNote() {
      const ta = document.getElementById('sidebarQuickNote');
      const val = nfc(ta.value.trim());
      if (!val) return;
      state.notes.unshift({ id: uid('n'), text: val, createdAt: new Date().toLocaleDateString('vi-VN') });
      ta.value = '';
      saveState();
      showToast('Đã lưu vào Quick Note!', 'success');
      if (state.activeView === 'quicknote') renderCurrentView();
    }

    document.getElementById('saveSidebarNoteBtn').addEventListener('click', saveSidebarQuickNote);
    document.getElementById('sidebarQuickNote').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        saveSidebarQuickNote();
      }
    });

    // Boot
    applyTheme();
    updateGoogleBadges();
    setActiveNav(state.activeView || 'study');
  </script>
</body>
</html>
